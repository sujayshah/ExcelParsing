<!--The content below is only a placeholder and can be replaced.-->
<div style="text-align:center">
  <form (ngSubmit)="onSubmit(f)">
    <input name="first" ngModel required>
    <input name="last" ngModel>
    <button type="submit">Submit</button>
  </form>
</div>
<h1>Color Palette</h1>
<mat-grid-list cols="4" rowHeight="100px">
  <mat-grid-tile
      *ngFor="let tile of tiles"
      [style.background]="tile.color">
    {{tile.text}}
  </mat-grid-tile>
</mat-grid-list>
<br>
<div class="palette-btn-bar">
  <button mat-raised-button (click)="addColor('yellow')">
    Add color
  </button><br><br>
  <button mat-raised-button (click)="resetDefault()">
    Reset to Default
  </button>
</div>

<!-- Dialog Palette Select -->

<h1 mat-dialog-title>Hi</h1>
<div mat-dialog-content>
  <p>What's your favorite animal?</p>
  <mat-form-field>
    <input matInput [(ngModel)]="">
  </mat-form-field>
</div>
<div mat-dialog-actions>
  <button mat-button (click)="onNoClick()">No Thanks</button>
  <button mat-button [mat-dialog-close]="" cdkFocusInitial>Ok</button>
</div>
